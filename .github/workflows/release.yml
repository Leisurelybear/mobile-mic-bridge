name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            python-architecture: x64
          - arch: arm64
            runner: windows-11-arm
            python-architecture: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: windows_receiver
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python-architecture }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[test] pyinstaller==6.21.0
      - run: python -m pytest -q
      - name: Build receiver executable
        run: pyinstaller --onefile --name mobile-mic-receiver-windows-${{ matrix.arch }} --collect-all sounddevice --collect-all zeroconf --collect-all qrcode main.py
      - uses: actions/upload-artifact@v7
        with:
          name: windows-receiver-${{ matrix.arch }}
          path: windows_receiver/dist/mobile-mic-receiver-windows-${{ matrix.arch }}.exe

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name mobile_mic_bridge .
          cp tool/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ../mobile-mic-bridge-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-app
          path: mobile-mic-bridge-android.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Generate iOS project
        run: |
          flutter create --platforms=ios --project-name mobile_mic_bridge .
          cp tool/Info.plist ios/Runner/Info.plist
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Archive unsigned app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app ../mobile-mic-bridge-ios-unsigned.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-app
          path: mobile-mic-bridge-ios-unsigned.zip

  publish:
    needs: [windows, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
