name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  receiver-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows_receiver
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[test]
      - run: python -m pytest -q
      - run: python -m mobile_mic_receiver.cli --help

  mobile-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Generate platform projects
        run: |
          flutter create --platforms=android,ios --project-name mobile_mic_bridge .
          cp tool/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/example/mobile_mic_bridge
          cp tool/android/*.kt android/app/src/main/kotlin/com/example/mobile_mic_bridge/
          cp tool/Info.plist ios/Runner/Info.plist
          cp tool/ios/AppDelegate.swift ios/Runner/AppDelegate.swift
      - run: flutter pub get
      - name: Flutter analyze
        shell: bash
        run: |
          set +e
          flutter analyze --machine 2>&1 | tee /tmp/flutter-analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < /tmp/flutter-analyze.log
          fi
          exit "$status"
      - name: Flutter test
        shell: bash
        run: |
          set +e
          flutter test 2>&1 | tee /tmp/flutter-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            encoded=$(base64 -w 0 /tmp/flutter-test.log)
            echo "::error title=Flutter test log (base64)::$encoded"
          fi
          exit "$status"
      - name: Build Android debug APK
        shell: bash
        run: |
          set +e
          flutter build apk --debug 2>&1 | tee /tmp/flutter-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            encoded=$(base64 -w 0 /tmp/flutter-build.log)
            echo "::error title=Flutter build log (base64)::$encoded"
          fi
          exit "$status"
