name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  receiver-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows_receiver
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[test]
      - run: python -m pytest -q
      - run: python -m mobile_mic_receiver.cli --help

  mobile-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Generate platform projects
        run: |
          flutter create --platforms=android,ios --project-name mobile_mic_bridge .
          cp tool/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp tool/Info.plist ios/Runner/Info.plist
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
