[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'mobile-mic-receiver'
version = '0.1.0'
description = 'Receive PCM audio from Mobile Mic Bridge and play it to Windows.'
requires-python = '>=3.10'
dependencies = [
  'sounddevice==0.5.5',
  'websockets==16.1.1',
  'zeroconf==0.150.0',
  'qrcode==8.2',
  'Pillow>=10.0',
  'customtkinter>=5.2.0',
]

[project.optional-dependencies]
test = ['pytest>=8.0,<9.0']

[project.scripts]
mobile-mic-receiver = 'mobile_mic_receiver.cli:main'
mobile-mic-receiver-gui = 'mobile_mic_receiver.gui.app:run_app'

[tool.setuptools.packages.find]
where = ['.']
include = ['mobile_mic_receiver*']

[tool.setuptools.package-data]
mobile_mic_receiver = ['web_assets/*']

[tool.pytest.ini_options]
testpaths = ['tests']
