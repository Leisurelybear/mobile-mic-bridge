[package]
name = 'mobile-mic-receiver'
version = '0.2.0'
edition = '2021'
description = 'Native Windows receiver for Mobile Mic Bridge'

[dependencies]
anyhow = '1.0'
clap = { version = '4.5', features = ['derive'] }
cpal = '0.16'
serde = { version = '1.0', features = ['derive'] }
serde_json = '1.0'
tungstenite = '0.27'

[profile.release]
lto = true
codegen-units = 1
strip = true
