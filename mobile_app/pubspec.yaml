name: mobile_mic_bridge
description: Use an iOS or Android phone as a Wi-Fi microphone for Windows.
publish_to: none
version: 0.2.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: 7.4.0
  nsd: 4.1.0
  record: 6.2.1
  shared_preferences: 2.5.5
  wakelock_plus: 1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  shared_preferences_platform_interface: 2.4.0

flutter:
  uses-material-design: true
